# The scenarios. Each defines the robot groups (the order of the joints in q), the tool frames held
# together by the carried object, the obstacles shared by all of its queries and the carried object.
# The obstacles of each query are in scenes/<scenario>/scene_NNNN/scene.yaml. The planner and metric
# parameters are the same for every scenario: config/planner.yaml.
scenarios:
  # S1: one arm holds a cup upright (n = 7, m = 2).
  panda_orientation:
    groups: [panda_arm]
    tips: [panda_hand_tcp]
    keep_direction: {link: panda_hand_tcp, local: [1, 0, 0], world: [0, 0, 1]}
    shelves:
      - {id: shelf_1, center: [0.8, 0.0, 0.75], yaw: -1.572, length: 0.7, width: 0.5, height: 1.5, thickness: 0.02, parts: 4}
    carried:
      id: cup
      link: panda_hand_tcp
      shape: cylinder
      radius: 0.03
      length: 0.1
      position: [0.0, 0.0, 0.0]
      quat_wxyz: [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]  # local z along the tool x axis
      touch_links: [panda_hand]
      ignore_links: [panda_hand_sc]
    fixed_joints:
      panda_finger_joint1: 0.0325
      panda_finger_joint2: 0.0325

  # S2: two arms carry a rigidly grasped tray (n = 14, m = 6).
  panda_dual:
    groups: [panda_arm_2, panda_arm_1]
    tips: [panda_2_hand_tcp, panda_1_hand_tcp]
    world_box_links: [base]
    tables:
      - {id: table_1, center: [0.5, -0.6, 0.3], length: 0.5, width: 0.9, height: 0.6, thickness: 0.05}
      - {id: table_2, center: [0.5, 0.6, 0.3], length: 0.5, width: 0.9, height: 0.6, thickness: 0.05}
    carried:
      id: tray
      link: panda_2_hand_tcp
      shape: box
      size: [0.225, 0.3, 0.01]
      position: [0.0, 0.1174990364441225, 0.14324149524059965]
      quat_wxyz: [0.32914517342087574, -0.9442793309258345, 0.0, 0.0]
      ignore_links: [panda_1_hand_sc, panda_2_hand_sc]
    fixed_joints:
      panda_1_finger_joint1: 0.0325
      panda_1_finger_joint2: 0.0325
      panda_2_finger_joint1: 0.0325
      panda_2_finger_joint2: 0.0325

  # S3: S2 with the tray kept level (n = 14, m = 8).
  panda_dual_orientation:
    groups: [panda_arm_2, panda_arm_1]
    tips: [panda_2_hand_tcp, panda_1_hand_tcp]
    world_box_links: [base]
    tables:
      - {id: table_1, center: [0.5, -0.6, 0.3], length: 0.5, width: 0.9, height: 0.6, thickness: 0.05}
      - {id: table_2, center: [0.5, 0.6, 0.3], length: 0.5, width: 0.9, height: 0.6, thickness: 0.05}
    carried:
      id: tray
      link: panda_2_hand_tcp
      shape: box
      size: [0.225, 0.3, 0.01]
      position: [0.0, 0.1174990364441225, 0.14324149524059965]
      quat_wxyz: [0.32914517342087574, -0.9442793309258345, 0.0, 0.0]
      ignore_links: [panda_1_hand_sc, panda_2_hand_sc]
    fixed_joints:
      panda_1_finger_joint1: 0.0325
      panda_1_finger_joint2: 0.0325
      panda_2_finger_joint1: 0.0325
      panda_2_finger_joint2: 0.0325
    keep_direction: {link: panda_2_hand_tcp, in_carried: true, local: [0, 0, 1], world: [0, 0, 1]}

  # S4: three arms carry a chair among boxes (n = 21, m = 12).
  panda_triple:
    groups: [panda_left, panda_right, panda_top]
    tips: [panda_left_hand_tcp, panda_right_hand_tcp, panda_top_hand_tcp]
    world_box_links: [base]
    boxes:
      - {id: sub_table, center: [0.69, -0.04, 1.0826], size: [0.37, 0.22, 0.165]}
      - {id: sub_table2, center: [0.465, -0.505, 1.0826], size: [0.22, 0.17, 0.165]}
      - {id: sub_table3, center: [0.595, 0.355, 1.0826], size: [0.17, 0.22, 0.165]}
      - {id: sub_table4, center: [0.42, 0.1, 1.0826], size: [0.22, 0.22, 0.165]}
    carried:
      id: chair
      link: panda_left_hand
      shape: mesh
      mesh: package://rmrrt/robots/objects/ikea_stefan_chair.stl
      position: [-0.0662922289291252, -0.41077047967330915, 0.47488043218092413]
      quat_wxyz: [0.9984774309826756, 0.0009134257840388643, 0.05232807062204693, 0.017428668811693117]
